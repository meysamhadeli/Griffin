name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/griffin-logo.png'
      - 'README.md'
      - 'CONTRIBUTION.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/griffin-logo.png'
      - 'README.md'
      - 'CONTRIBUTION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - name: Build static documentation and search index
        run: npm run build
        env:
          DOCS_BASE_PATH: /Griffin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4